<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-t="panel.comun.panel_tienda">Panel de la tienda</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F172A">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fuente sin bloquear el primer pintado (se ve la del sistema hasta que llega) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/panel.css">
  <script type="module" src="../assets/js/panel/panel.js"></script>
</head>
<body>
  <div class="cargando-panel" id="cargando-panel" role="status"><span class="spinner" aria-hidden="true"></span><span data-t="panel.comun.cargando_panel">Cargando el panel…</span></div>

  <!-- Acceso -->
  <main class="acceso" id="acceso" hidden>
    <div class="acceso-caja">
      <p class="acceso-marca" data-t="panel.comun.panel_tienda">Panel de la tienda</p>
      <div id="acceso-contenido"></div>
    </div>
  </main>

  <!-- Panel -->
  <div class="app" id="app" hidden>
    <header class="barra-superior">
      <div class="barra-superior-fila">
        <div class="barra-titulo">
          <span class="barra-tienda" id="barra-tienda"></span>
          <span class="barra-usuario" id="barra-usuario"></span>
        </div>
        <div class="barra-acciones">
          <a class="boton boton--suave boton--chico" href="../" target="_blank" rel="noopener" data-t="panel.comun.ver_sitio">Ver mi sitio</a>
          <button type="button" class="boton boton--suave boton--chico" id="salir" data-t="panel.comun.salir">Salir</button>
        </div>
      </div>
      <nav class="navegacion" aria-label="Secciones del panel" data-t-aria-label="panel.nav.secciones">
        <a href="#/inicio" data-ruta="inicio" data-rol="gestor" data-t="panel.nav.inicio" hidden>Inicio</a>
        <a href="#/inventario" data-ruta="inventario" data-rol="gestor" data-t="panel.nav.inventario" hidden>Inventario</a>
        <a href="#/tienda" data-ruta="tienda" data-rol="gestor" data-t="panel.nav.tienda" hidden>Mi tienda</a>
        <a href="#/catalogo" data-ruta="catalogo" data-rol="gestor" data-t="panel.nav.catalogo" hidden>Catálogo</a>
        <a href="#/legales" data-ruta="legales" data-rol="gestor" data-t="panel.nav.legales" hidden>Legales</a>
        <a href="#/usuarios" data-ruta="usuarios" data-rol="administrador" data-t="panel.nav.usuarios" hidden>Usuarios</a>
      </nav>
    </header>
    <main class="vista" id="vista" tabindex="-1"></main>
  </div>

  <div class="aviso-flotante" id="aviso-flotante" role="status" aria-live="polite"></div>
  <dialog class="confirmar" id="confirmar" aria-labelledby="confirmar-titulo"></dialog>
</body>
</html>
